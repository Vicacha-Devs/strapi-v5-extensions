openapi: 3.0.3
info:
  title: Editorial Notes & Pins (@vicacha-devs/strapi-plugin-notes)
  version: 1.1.2
  description: Strapi v5 Entity Notes plugin (forked & evolved from strapi-community/strapi-plugin-notes) with
    Audit Logs-style modal metadata (Created/Updated At & By), pinned notes, category badges, document/locale
    scoping, and a Global Notes Hub.
servers:
  - url: http://127.0.0.1:1337
    description: Local Strapi v5 development server
paths:
  /notes/notes:
    get:
      operationId: getNotesNotes
      summary: Find
      description: Strapi v5 Admin API endpoint handled by `notesController.find`.
      tags:
        - Admin API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
    post:
      operationId: postNotesNotes
      summary: Create
      description: Strapi v5 Admin API endpoint handled by `notesController.create`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notes"
  /notes/notes/stats:
    get:
      operationId: getNotesNotesStats
      summary: Stats
      description: Strapi v5 Admin API endpoint handled by `notesController.stats`.
      tags:
        - Admin API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
  /notes/notes/{id}:
    get:
      operationId: getNotesNotesById
      summary: Find One
      description: Strapi v5 Admin API endpoint handled by `notesController.findOne`.
      tags:
        - Admin API
      parameters:
        - name: id
          in: path
          required: true
          description: Target id identifier
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
    put:
      operationId: putNotesNotesById
      summary: Update
      description: Strapi v5 Admin API endpoint handled by `notesController.update`.
      tags:
        - Admin API
      parameters:
        - name: id
          in: path
          required: true
          description: Target id identifier
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notes"
    delete:
      operationId: deleteNotesNotesById
      summary: Delete
      description: Strapi v5 Admin API endpoint handled by `notesController.delete`.
      tags:
        - Admin API
      parameters:
        - name: id
          in: path
          required: true
          description: Target id identifier
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
  /api/notes/notes:
    get:
      operationId: getApiNotesNotes
      summary: Find
      description: Strapi v5 Content API endpoint handled by `notesController.find`. Protected by Strapi Users &
        Permissions / API Token (`bearerAuth`); can be granted to the `Public` role in Strapi Settings.
      tags:
        - Content API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
  /api/notes/notes/{id}:
    get:
      operationId: getApiNotesNotesById
      summary: Find One
      description: Strapi v5 Content API endpoint handled by `notesController.findOne`. Protected by Strapi Users &
        Permissions / API Token (`bearerAuth`); can be granted to the `Public` role in Strapi Settings.
      tags:
        - Content API
      parameters:
        - name: id
          in: path
          required: true
          description: Target id identifier
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notes"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    Notes:
      type: object
      description: Editorial notes attached to Content Manager entity records
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        title:
          type: string
          maxLength: 255
        content:
          type: string
        category:
          type: string
          enum:
            - general
            - todo
            - blocker
            - idea
          default: general
        isPinned:
          type: boolean
          default: false
        entityId:
          type: integer
        entityDocumentId:
          type: string
          maxLength: 128
        entitySlug:
          type: string
          maxLength: 160
        entityLocale:
          type: string
          maxLength: 32
        createdByName:
          type: string
          maxLength: 120
        updatedByName:
          type: string
          maxLength: 120
      required:
        - title
        - category
        - entitySlug
