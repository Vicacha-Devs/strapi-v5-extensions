components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    BroadcastAutomationRule:
      type: object
      description: EventHub-driven automated multi-channel broadcast rule
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        name:
          type: string
        slug:
          type: string
        eventName:
          type: string
        targetContentType:
          type: string
        topic:
          type: string
          default: announcements
        channels:
          type: object
          additionalProperties: true
        active:
          type: boolean
          default: true
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          default: normal
        subjectTemplate:
          type: string
        bodyTextTemplate:
          type: string
        bodyHtmlTemplate:
          type: string
        ctaLabelTemplate:
          type: string
        ctaUrlTemplate:
          type: string
        translations:
          type: object
          additionalProperties: true
        lastTriggeredAt:
          type: string
          format: date-time
        triggerCount:
          type: integer
          minimum: 0
          default: 0
      required:
        - name
        - slug
        - eventName
        - topic
        - channels
        - subjectTemplate
        - bodyTextTemplate
    BroadcastCampaign:
      type: object
      description: Omnichannel Email, Telegram & WhatsApp broadcast campaign
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        title:
          type: string
        slug:
          type: string
        topic:
          type: string
          default: announcements
        channels:
          type: object
          additionalProperties: true
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          default: normal
        status:
          type: string
          enum:
            - draft
            - scheduled
            - sending
            - sent
            - failed
            - cancelled
          default: draft
        scheduledAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        subject:
          type: string
        bodyText:
          type: string
        bodyHtml:
          type: string
        ctaLabel:
          type: string
        ctaUrl:
          type: string
        mediaUrl:
          type: string
        emailTemplateRef:
          type: string
        whatsappTemplateName:
          type: string
        whatsappGroupIds:
          type: object
          additionalProperties: true
        telegramChatId:
          type: string
        telegramThreadId:
          type: integer
        translations:
          type: object
          additionalProperties: true
        secondaryDate:
          type: object
          additionalProperties: true
        secondaryDateLabel:
          type: string
        stats:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
      required:
        - title
        - slug
        - topic
        - channels
        - priority
        - status
        - subject
        - bodyText
    BroadcastDeliveryLog:
      type: object
      description: Idempotent, PII-masked multi-channel delivery audit log
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        idempotencyKey:
          type: string
        campaignSlug:
          type: string
        channel:
          type: string
          enum:
            - email
            - telegram
            - whatsapp
        driver:
          type: string
        recipientMasked:
          type: string
        locale:
          type: string
          default: es
        status:
          type: string
          enum:
            - sent
            - simulated
            - skipped_duplicate
            - failed
        externalMessageId:
          type: string
        errorMessage:
          type: string
        sentAt:
          type: string
          format: date-time
        secondaryDateLabel:
          type: string
      required:
        - idempotencyKey
        - campaignSlug
        - channel
        - driver
        - recipientMasked
        - locale
        - status
        - sentAt
