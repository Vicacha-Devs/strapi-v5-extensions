      operationId: getApiBroadcastsPublicChannels
      summary: List Public Channels
      description: Strapi v5 Content API endpoint handled by `broadcastController.listPublicChannels`.
      tags:
        - Content API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
