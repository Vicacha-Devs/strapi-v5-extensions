openapi: 3.0.3
info:
  title: Omnichannel Broadcasts (@vicacha-devs/strapi-plugin-broadcasts)
  version: 0.2.1
  description: Omnichannel community broadcasts (Email newsletters, Telegram Bot & Channel/Forum topics,
    WhatsApp Cloud API / OpenWA / Evolution, EventHub automation rules, and double opt-in subscriber
    segmentation) for Strapi v5 with multi-language and multi-calendar support.
servers:
  - url: http://127.0.0.1:1337
    description: Local Strapi v5 development server
paths:
