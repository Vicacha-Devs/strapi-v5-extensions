components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    InboxAlertBanner:
      type: object
      description: Time-bounded multi-language urgent announcement ticker / banner
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        code:
          type: string
        title:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - info
            - warning
            - urgent
            - celebration
          default: info
        ctaLabel:
          type: string
        ctaUrl:
          type: string
        dismissible:
          type: boolean
          default: true
        active:
          type: boolean
          default: true
        priority:
          type: integer
          default: 10
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        translations:
          type: object
          additionalProperties: true
      required:
        - code
        - title
        - message
        - severity
    InboxSubmission:
      type: object
      description: Form submission & Service-Desk Casework ticket
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        referenceCode:
          type: string
        formSlug:
          type: string
        formTitle:
          type: string
        category:
          type: string
          enum:
            - contact
            - service_desk
            - inquiry
            - application
            - volunteer
            - custom
          default: contact
        status:
          type: string
          enum:
            - new
            - read
            - under_review
            - scheduled
            - completed
            - rejected
            - archived
          default: new
        priority:
          type: string
          enum:
            - low
            - normal
            - high
            - urgent
          default: normal
        department:
          type: string
          default: general
        locale:
          type: string
          default: es
        applicantName:
          type: string
        applicantEmail:
          type: string
          format: email
        applicantPhone:
          type: string
        data:
          type: object
          additionalProperties: true
        checklistItems:
          type: object
          additionalProperties: true
        staffNotes:
          type: string
        assignedTo:
          type: string
        linkedBookingId:
          type: string
        linkedCertificateNumber:
          type: string
        formBuilderSubmissionId:
          type: integer
        submittedAt:
          type: string
          format: date-time
        secondaryDate:
          type: object
          additionalProperties: true
      required:
        - referenceCode
        - formSlug
        - status
        - priority
        - data
        - submittedAt
    InboxSubscriber:
      type: object
      description: Double Opt-In newsletter and community topic subscriber
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
        locale:
          type: string
          default: es
        topics:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
            - pending
            - confirmed
            - unsubscribed
          default: pending
        confirmedAt:
          type: string
          format: date-time
        unsubscribedAt:
          type: string
          format: date-time
        sourceFormSlug:
          type: string
      required:
        - email
        - status
