                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /certificates/templates:
    get:
      operationId: getCertificatesTemplates
      summary: List Templates
      description: Strapi v5 Admin API endpoint handled by `admin.listTemplates`.
      tags:
        - Admin API
      parameters:
        - name: locale
