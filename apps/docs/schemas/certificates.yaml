openapi: 3.0.3
info:
  title: Digital Certificates (Ed25519) (@vicacha-devs/strapi-plugin-certificates)
  version: 1.1.1
  description: Generic Strapi v5 Official Certificates, Cryptographic Ed25519 Signing, Printable Credentials &
    QR Verification Plugin powered by @vicacha-devs/strapi-plugin-calendar
servers:
  - url: http://127.0.0.1:1337
    description: Local Strapi v5 development server
paths:
  /certificates/settings:
    get:
      operationId: getCertificatesSettings
      summary: Get Settings
      description: Strapi v5 Admin API endpoint handled by `admin.getSettings`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
    put:
      operationId: putCertificatesSettings
      summary: Update Settings
      description: Strapi v5 Admin API endpoint handled by `admin.updateSettings`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /certificates/settings/rotate-keys:
    post:
      operationId: postCertificatesSettingsRotateKeys
      summary: Rotate Keys
      description: Strapi v5 Admin API endpoint handled by `admin.rotateKeys`.
      tags:
