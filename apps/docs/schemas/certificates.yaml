components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    IssuedCertificate:
      type: object
      description: Cryptographically signed official certificate record with signatory and witness attestation
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        serialNumber:
          type: string
          maxLength: 64
        templateDocumentId:
          type: string
          maxLength: 120
        templateSlug:
          type: string
          maxLength: 120
        templateName:
          type: string
          maxLength: 160
        status:
          type: string
          enum:
            - pending_approval
            - issued
            - revoked
            - expired
          default: pending_approval
        recipientFullName:
          type: string
          maxLength: 200
        recipientChosenName:
          type: string
          maxLength: 200
        recipientEmail:
          type: string
          format: email
        recipientPhone:
          type: string
          maxLength: 64
        recipientNationality:
          type: string
          maxLength: 120
        nationalIdMasked:
          type: string
          maxLength: 32
        issuedAt:
          type: string
          maxLength: 40
        expiresAt:
          type: string
          maxLength: 40
        revokedAt:
          type: string
          maxLength: 40
        revocationReason:
          type: string
        signatories:
          type: object
          additionalProperties: true
        witnesses:
          type: object
          additionalProperties: true
        customData:
          type: object
          additionalProperties: true
        secondaryDates:
          type: object
          additionalProperties: true
        canonicalPayloadHash:
          type: string
          maxLength: 128
        cryptographicSignature:
          type: string
        publicKeyFingerprint:
          type: string
          maxLength: 96
        esignProvider:
          type: string
          enum:
            - none
            - docusign
            - webhook
          default: none
        esignEnvelopeId:
          type: string
          maxLength: 128
        esignEnvelopeStatus:
          type: string
          enum:
            - not_sent
            - sent
            - delivered
            - completed
            - declined
            - voided
          default: not_sent
        esignCompletedAt:
          type: string
          maxLength: 40
        linkedBookingCode:
          type: string
          maxLength: 64
        notes:
          type: string
      required:
        - serialNumber
        - templateDocumentId
        - templateSlug
        - templateName
        - status
        - recipientFullName
        - issuedAt
        - canonicalPayloadHash
        - cryptographicSignature
        - publicKeyFingerprint
    CertificateTemplate:
      type: object
      description: Reusable official certificate template with signatory rules, witness requirements, and body statement
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        name:
          type: string
          maxLength: 160
        slug:
          type: string
        description:
          type: string
        serialPrefix:
          type: string
          maxLength: 8
          default: CERT
        defaultValidityDays:
          type: integer
          minimum: 0
        requiresWitnesses:
          type: boolean
          default: false
        minWitnesses:
          type: integer
          minimum: 0
          default: 0
        requiresApproval:
          type: boolean
          default: true
        esignEnabled:
          type: boolean
          default: false
        esignProvider:
          type: string
          enum:
            - none
            - docusign
            - webhook
          default: none
        organizationName:
          type: string
          maxLength: 200
        organizationSubheader:
          type: string
          maxLength: 240
        headerText:
          type: string
          maxLength: 240
        titleText:
          type: string
          maxLength: 200
        bodyTemplate:
          type: string
        footerText:
          type: string
        defaultSignatories:
          type: object
          additionalProperties: true
        customFieldsSchema:
          type: object
          additionalProperties: true
        secondaryCalendars:
          type: object
          additionalProperties: true
        accentColor:
          type: string
          maxLength: 16
          default: "#14532d"
        active:
          type: boolean
          default: true
      required:
        - name
        - slug
        - serialPrefix
        - organizationName
        - titleText
        - bodyTemplate
