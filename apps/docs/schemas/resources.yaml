components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    ResourceGalleryAlbum:
      type: object
      description: Curated photo and video albums synced with Strapi v5 Media Library folders and Cloudinary optimization
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        title:
          type: string
          maxLength: 200
        slug:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
            - architecture
            - community
            - events
            - ramadan_eid
            - heritage
            - press
          default: community
        coverPhoto:
          type: object
          description: Strapi Media Library asset reference
          properties:
            id:
              type: integer
            url:
              type: string
            mime:
              type: string
        photos:
          type: object
          description: Strapi Media Library asset reference
          properties:
            id:
              type: integer
            url:
              type: string
            mime:
              type: string
        mediaFolderId:
          type: integer
        mediaFolderPath:
          type: string
          maxLength: 160
        eventDate:
          type: string
          format: date
        secondaryDateOverride:
          type: string
          maxLength: 80
        photographerCredit:
          type: string
          maxLength: 140
        framingNotes:
          type: string
          maxLength: 500
        featured:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 0
        photoCount:
          type: integer
          minimum: 0
          default: 0
      required:
        - title
        - slug
        - category
    ResourceGlossaryTerm:
      type: object
      description: Multilingual A-Z glossary terms with native script, transliteration, and Strapi Media Library
        audio pronunciation
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        term:
          type: string
          maxLength: 120
        slug:
          type: string
        nativeScript:
          type: string
          maxLength: 200
        transliteration:
          type: string
          maxLength: 200
        definition:
          type: string
        category:
          type: string
          enum:
            - beliefs
            - worship
            - ethics
            - history
            - community
            - general
          default: general
        letterGroup:
          type: string
          maxLength: 4
          default: A
        pronunciationAudio:
          type: object
          description: Strapi Media Library asset reference
          properties:
            id:
              type: integer
            url:
              type: string
            mime:
              type: string
        relatedTerms:
          type: object
          additionalProperties: true
        featured:
          type: boolean
          default: false
      required:
        - term
        - slug
        - definition
        - category
    ResourcePublication:
      type: object
      description: Localized digital library books, guides, pamphlets, and press kit assets backed by the Strapi v5
        Media Library
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        title:
          type: string
          maxLength: 200
        slug:
          type: string
        summary:
          type: string
        category:
          type: string
          enum:
            - guide
            - book
            - pamphlet
            - press_kit
            - academic
            - general
          default: guide
        file:
          type: object
          description: Strapi Media Library asset reference
          properties:
            id:
              type: integer
            url:
              type: string
            mime:
              type: string
        coverImage:
          type: object
          description: Strapi Media Library asset reference
          properties:
            id:
              type: integer
            url:
              type: string
            mime:
              type: string
        authorName:
          type: string
          maxLength: 140
        authorSlug:
          type: string
          maxLength: 140
        isbnOrReference:
          type: string
          maxLength: 80
        pageCount:
          type: integer
          minimum: 1
        languageCode:
          type: string
          maxLength: 10
          default: es
        publishedAtDate:
          type: string
          format: date
        secondaryDateOverride:
          type: string
          maxLength: 80
        mediaFolderPath:
          type: string
          maxLength: 160
        externalDownloadUrl:
          type: string
          maxLength: 500
        downloadCount:
          type: integer
          minimum: 0
          default: 0
        featured:
          type: boolean
          default: false
        allowPublicDownload:
          type: boolean
          default: true
      required:
        - title
        - slug
        - category
