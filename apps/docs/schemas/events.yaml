components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    Event:
      type: object
      description: Recurring & single events managed by strapi-plugin-events
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        title:
          type: string
          maxLength: 200
        slug:
          type: string
        summary:
          type: string
          maxLength: 500
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        allDay:
          type: boolean
          default: false
        timezone:
          type: string
          default: UTC
        recurrence:
          type: string
        eventStatus:
          type: string
          enum:
            - scheduled
            - cancelled
            - postponed
            - rescheduled
          default: scheduled
        locationType:
          type: string
          enum:
            - in_person
            - online
            - hybrid
          default: in_person
        location:
          type: string
        virtualUrl:
          type: string
        category:
          type: string
          default: general
        speaker:
          type: string
        speakerSlug:
          type: string
        color:
          type: string
          default: "#0D9488"
        featured:
          type: boolean
          default: false
        rsvpEnabled:
          type: boolean
          default: false
        capacity:
          type: integer
          minimum: 1
        waitlistEnabled:
          type: boolean
          default: true
        maxGuestsPerRegistration:
          type: integer
          minimum: 1
          default: 5
        registrationDeadline:
          type: string
          format: date-time
        alternateDates:
          type: object
          additionalProperties: true
        poster:
          type: object
          description: Strapi Media Library asset reference
          properties:
            id:
              type: integer
            url:
              type: string
            mime:
              type: string
        actionLinks:
          type: object
          additionalProperties: true
        spotlightConfig:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
      required:
        - title
        - slug
        - startDate
        - eventStatus
    EventRegistrationRSVP:
      type: object
      description: Attendee RSVPs, waitlists, and check-ins managed by strapi-plugin-events
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        eventUid:
          type: string
          default: plugin::events.event
        eventDocumentId:
          type: string
        eventTitle:
          type: string
        occurrenceDate:
          type: string
        attendeeName:
          type: string
          maxLength: 160
        attendeeEmail:
          type: string
          format: email
        attendeePhone:
          type: string
          maxLength: 50
        guestsCount:
          type: integer
          minimum: 1
          default: 1
        status:
          type: string
          enum:
            - confirmed
            - waitlisted
            - cancelled
            - checked_in
          default: confirmed
        checkedInAt:
          type: string
          format: date-time
        locale:
          type: string
          default: es
        notes:
          type: string
          maxLength: 2000
        metadata:
          type: object
          additionalProperties: true
      required:
        - eventUid
        - eventDocumentId
        - occurrenceDate
        - attendeeName
        - attendeeEmail
        - guestsCount
        - status
