openapi: 3.0.3
info:
  title: Events, RSVP & Check-In (@vicacha-devs/strapi-plugin-events)
  version: 1.1.1
  description: Production-grade Strapi v5 Events, RSVP Capacity, Automatic Waitlist Promotion, Attendee Check-In
    & iCal Plugin powered by @vicacha-devs/strapi-plugin-calendar
servers:
  - url: http://127.0.0.1:1337
    description: Local Strapi v5 development server
paths:
  /events/settings:
    get:
      operationId: getEventsSettings
      summary: Get Settings
      description: Strapi v5 Admin API endpoint handled by `admin.getSettings`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
    put:
      operationId: putEventsSettings
      summary: Update Settings
      description: Strapi v5 Admin API endpoint handled by `admin.updateSettings`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /events/calendar:
    get:
      operationId: getEventsCalendar
      summary: Get Calendar
      description: Strapi v5 Admin API endpoint handled by `admin.getCalendar`.
      tags:
        - Admin API
      parameters:
        - name: from
          in: query
          required: false
          description: Start of ISO-8601 date/time query window
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: End of ISO-8601 date/time query window
          schema:
            type: string
        - name: sourceId
          in: query
          required: false
          description: Filter by registered calendar collection source ID
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Filter by category name
          schema:
            type: string
        - name: locale
          in: query
          required: false
          description: BCP-47 content/display locale (e.g. en, es, ar, tr)
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Event"
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
