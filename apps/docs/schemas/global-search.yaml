openapi: 3.0.3
info:
  title: Global Command Search (@vicacha-devs/strapi-plugin-global-search)
  version: 2.1.1
  description: Spotlight-style global search across every collection type and single type in the Strapi v5 admin
    panel. Zero configuration.
servers:
  - url: http://127.0.0.1:1337
    description: Local Strapi v5 development server
paths:
  /global-search/search:
    get:
      operationId: getGlobalSearchSearch
      summary: Find
      description: Strapi v5 Admin API endpoint handled by `search.find`.
      tags:
        - Admin API
      parameters:
        - name: q
          in: query
          required: false
          description: Search query string
          schema:
            type: string
        - name: locale
          in: query
          required: false
          description: Filter matches by Strapi locale
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
  /global-search/schema:
    get:
      operationId: getGlobalSearchSchema
      summary: Find
      description: Strapi v5 Admin API endpoint handled by `schema.find`.
      tags:
        - Admin API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
  /global-search/schema/all:
    get:
      operationId: getGlobalSearchSchemaAll
      summary: Find All
      description: Strapi v5 Admin API endpoint handled by `schema.findAll`.
      tags:
        - Admin API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
  /global-search/settings:
    get:
      operationId: getGlobalSearchSettings
      summary: Find
      description: Strapi v5 Admin API endpoint handled by `settings.find`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
    put:
      operationId: putGlobalSearchSettings
      summary: Update
      description: Strapi v5 Admin API endpoint handled by `settings.update`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /global-search/settings/reset:
    post:
      operationId: postGlobalSearchSettingsReset
      summary: Reset
      description: Strapi v5 Admin API endpoint handled by `settings.reset`.
      tags:
        - Admin API
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
