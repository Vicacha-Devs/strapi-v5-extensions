components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Strapi v5 API Token or Admin JWT Bearer authentication
  schemas:
    IslamHilalMoonSightingAnnouncement:
      type: object
      description: Official Mosque Hilal Moon-Sighting confirmations for Ramadan, Eid al-Fitr, and Dhu al-Hijjah
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        occasion:
          type: string
          enum:
            - ramadan
            - eid_al_fitr
            - dhul_hijjah_eid_al_adha
            - monthly_hilal
          default: ramadan
        hijriYear:
          type: integer
        hijriMonth:
          type: integer
        confirmedGregorianDate:
          type: string
        shiftingApplied:
          type: string
          default: "0"
        approvedByImam:
          type: string
        notes:
          type: object
          additionalProperties: true
        broadcastDispatched:
          type: boolean
          default: false
      required:
        - occasion
        - hijriYear
        - hijriMonth
        - confirmedGregorianDate
    IslamScriptureDuaEntry:
      type: object
      description: Custom curated Quranic Ayah, Prophetic Hadith, or Hisnul Muslim Dua/Adhkar entry
      properties:
        documentId:
          type: string
          description: Strapi v5 Document Service unique identifier
        entryKind:
          type: string
          enum:
            - ayah
            - hadith
            - dua
          default: dua
        slug:
          type: string
        referenceKey:
          type: string
        arabicText:
          type: string
        transliteration:
          type: string
        translations:
          type: object
          additionalProperties: true
        reflections:
          type: object
          additionalProperties: true
        gradingOrCategory:
          type: string
        recommendedRepetitions:
          type: integer
          default: 1
        audioUrl:
          type: string
        topicTags:
          type: object
          additionalProperties: true
        active:
          type: boolean
          default: true
      required:
        - entryKind
        - slug
        - referenceKey
        - arabicText
        - translations
