    Astronomical Engine, Qibla Spherical Compass, Hilal Moon-Sighting & Eid/Ramadan Operations,
    Quran/Hadith/Dua Hub, and Zakat/Nisab/Fitrana/Fidyah/Kaffarah Calculators powered by
    @vicacha-devs/strapi-plugin-calendar"
servers:
  - url: http://127.0.0.1:1337
    description: Local Strapi v5 development server
paths:
  /islam/overview:
    get:
      operationId: getIslamOverview
      summary: Get Overview
      description: Strapi v5 Admin API endpoint handled by `admin.getOverview`.
      tags:
        - Admin API
      parameters:
        - name: locale
          in: query
          required: false
          description: Optional Strapi i18n locale filter
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Bad Request — validation or parameter error
        "401":
          description: Unauthorized — missing or invalid Bearer token
        "403":
          description: Forbidden — insufficient Strapi RBAC permissions
