name: Bug Report
description: Report a bug in one of the @vicacha-devs/strapi-plugin-* packages
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **@vicacha-devs/strapi-v5-extensions**! Please provide the details below.

  - type: dropdown
    id: plugin
    attributes:
      label: Affected Plugin / Package
      options:
        - "@vicacha-devs/strapi-plugin-bookings"
        - "@vicacha-devs/strapi-plugin-broadcasts"
        - "@vicacha-devs/strapi-plugin-calendar"
        - "@vicacha-devs/strapi-plugin-certificates"
        - "@vicacha-devs/strapi-plugin-donations"
        - "@vicacha-devs/strapi-plugin-events"
        - "@vicacha-devs/strapi-plugin-inbox"
        - "@vicacha-devs/strapi-plugin-islam"
        - "@vicacha-devs/strapi-plugin-media-feeds"
        - "@vicacha-devs/strapi-plugin-resources"
        - "apps/dashboard (Strapi v5 Sandbox)"
        - "Monorepo Tooling / Build / CI"
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Plugin Layer
      options:
        - "Admin Panel UI (@strapi/design-system / React)"
        - "Server (Controllers, Services, Routes, Content-Types, Lifecycles)"
        - "TypeScript Types / Build (@strapi/sdk-plugin)"
        - "Internationalization (Admin Translations)"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Strapi & Plugin Version
      description: Specify the Strapi v5 version, plugin version, and Node.js version.
      placeholder: "Strapi v5.39.0, @vicacha-devs/strapi-plugin-events@0.2.0, Node v22.14.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Enable the plugin in config/plugins.ts
        2. Open the Strapi Admin Panel and navigate to '...'
        3. Trigger action '...'
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Stack Trace
      render: shell
