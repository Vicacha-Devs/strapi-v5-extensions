name: Docs (build & GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Only one Pages deployment at a time; never cancel a deployment mid-flight.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Defaults serve the GitHub Pages project URL
      # (https://<owner>.github.io/<repo>/). For a custom domain set the
      # repository variables DOCS_SITE=https://strapi-extensions.vicacha.dev
      # and DOCS_BASE=/.
      DOCS_SITE: ${{ vars.DOCS_SITE || format('https://{0}.github.io', github.repository_owner) }}
      DOCS_BASE: ${{ vars.DOCS_BASE || format('/{0}', github.event.repository.name) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm --filter @vicacha-devs/docs build

      # Needs the Astro content types generated by the build above.
      - name: Typecheck docs app
        run: pnpm --filter @vicacha-devs/docs test:ts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
